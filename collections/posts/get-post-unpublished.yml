info:
  name: Get post — unpublished
  type: http
  seq: 15

http:
  method: GET
  url: "{{baseUrl}}/api/v1/posts/{{postId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('responds with 404', () => {
          expect(res.status).to.equal(404);
        });
        test('reports the post as not found', () => {
          expect(res.body.message).to.equal('The requested post was not found');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Unpublished posts are hidden from public UUID reads.
