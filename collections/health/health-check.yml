info:
  name: Health check
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"

runtime:
  scripts:
    - type: tests
      code: |-
        test('responds with 200', () => {
          expect(res.status).to.equal(200);
        });
        test('reports healthy status', () => {
          expect(res.body).to.eql({ status: 'healthy' });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: 'Liveness probe — no authentication required. Returns {"status": "healthy"}.'
