name: Build and test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      Coverage_File: coverage.xml
    continue-on-error: false
    steps:

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: ".python-version"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        cache-dependency-glob: "uv.lock"
        enable-cache: true

    - name: Install project dependencies
      run: uv sync --locked

    - name: Run Bandit security scanner
      run: |
        uv run -m bandit --severity-level high --confidence-level high -r app/ -vvv

    - name: Run ruff linter
      run: |
        uv run ruff check app/ tests/ --statistics
        uv run ruff format --check app/ tests/

    - name: Running tests with Pytest and generate coverage
      run: |
        uv run -m pytest --cov-report=term --cov-report=xml:$Coverage_File --cov=app

    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      if: success()
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v6
      with:
        args: >
          -Dsonar.language=python
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.python.coverage.reportPaths=coverage.xml
          -Dsonar.sources=app/
          -Dsonar.tests=tests/
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  newman:
    name: Docker end-to-end (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Docker tests are the last gate: only run them when the static checks and
    # the unit/integration suite passed (they are the slowest and least
    # diagnostic step).
    needs: build-and-test
    steps:

    - uses: actions/checkout@v7

    - name: Build application image
      run: docker compose build

    - name: Start LocalStack
      run: docker compose up -d --wait --wait-timeout 120 localstack

    - name: Seed AWS resources
      run: |
        docker compose run --rm --no-deps app sh -c \
          "uv sync --frozen && uv run python -m scripts.init_localstack"

    - name: Start application
      run: docker compose up -d --wait --wait-timeout 180 app

    - name: Run Postman collection with Newman
      run: |
        docker run --rm --network "$(docker inspect "$(docker compose ps -q app)" --format '{{range $name, $config := .NetworkSettings.Networks}}{{$name}}{{end}}')" \
          -v "$PWD/postman:/postman:ro" \
          postman/newman:latest run /postman/personal_backend_service.postman_collection.json \
          --env-var baseUrl=http://app:8080 \
          --ignore-redirects

    - name: Clean up containers
      if: always()
      run: docker compose down -v --remove-orphans || true

