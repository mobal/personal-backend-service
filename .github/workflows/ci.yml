name: Build and test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      Coverage_File: coverage.xml
    continue-on-error: false
    steps:

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: ".python-version"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: 0.12.19
        cache-dependency-glob: "uv.lock"
        enable-cache: true

    - name: Install project dependencies
      run: uv sync --locked

    - name: Run Bandit security scanner
      run: |
        uv run -m bandit --severity-level high --confidence-level high -r app/ -vvv

    - name: Run ruff linter
      run: |
        uv run ruff check app/ tests/ --statistics
        uv run ruff format --check app/ tests/

    - name: Run ty type checker
      run: make ty

    - name: Running tests with rstest and generate coverage
      run: |
        uv run rstest -n auto --cov=app --cov-branch --cov-report=term --cov-report=xml:$Coverage_File

    - name: Build and verify Lambda artifacts
      run: make build

    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      if: success()
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v6
      with:
        args: >
          -Dsonar.language=python
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.python.coverage.reportPaths=coverage.xml
          -Dsonar.sources=app/
          -Dsonar.tests=tests/
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  bruno:
    name: Docker end-to-end (Bruno)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Docker tests are the last gate: only run them when the static checks and
    # the unit/integration suite passed (they are the slowest and least
    # diagnostic step).
    needs: build-and-test
    steps:

    - uses: actions/checkout@v7

    - name: Start AWS Emulator and the application
      # builds both images; the app seeds the emulator on start
      run: docker compose up -d --build --wait --wait-timeout 300 app

    - name: Log the AWS Emulator version
      # The package is not pinned (AWS publishes no versioned URL and `latest`
      # changes daily), so record which build this run was tested against.
      run: docker compose exec -T emulator aws-emulator --version

    - name: Run Bruno collection
      # The Bruno CLI joins the emulator's network namespace: the app is reached
      # as localhost and presigned S3 URLs point at the emulator's 127.0.0.1:9297.
      # --insecure because the emulator uses a self-signed certificate.
      run: |
        docker run --rm --network "container:$(docker compose ps -q emulator)" \
          -v "$PWD/collections:/bruno:ro" \
          usebruno/cli:4.3.0 run --env e2e -r \
          --env-var baseUrl=http://localhost:8080 \
          --insecure

    - name: Clean up containers
      if: always()
      run: docker compose down -v --remove-orphans || true

  infrastructure:
    name: Validate infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: Check formatting
        run: tofu fmt -check -recursive infrastructure/

      - name: Initialize providers
        run: tofu -chdir=infrastructure init -backend=false -lockfile=readonly

      - name: Validate configuration
        run: tofu -chdir=infrastructure validate

      - name: Lint Terraform
        run: tflint --init && tflint --chdir=./infrastructure
