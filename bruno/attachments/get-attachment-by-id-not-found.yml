info:
  name: Get attachment by id — not found
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/api/v1/posts/{{attachmentPostId}}/attachments/{{unknownAttachmentId}}"

runtime:
  scripts:
    - type: before-request
      code: bru.setVar('unknownAttachmentId', bru.interpolate('{{$guid}}'));
    - type: tests
      code: |-
        test('responds with 404', () => {
          expect(res.status).to.equal(404);
        });
        test('reports the attachment as not found', () => {
          expect(res.body.status).to.equal(404);
          expect(res.body.message).to.include('was not found');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: An attachment uuid not embedded in the post must yield the 404 envelope. The pre-request script picks a random uuid.
