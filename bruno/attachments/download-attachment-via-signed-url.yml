info:
  name: Download attachment via signed URL
  type: http
  seq: 7

http:
  method: GET
  url: "{{signedDownloadUrl}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('redirect target retrieves attachment content', () => {
          expect(res.status).to.equal(200);
          expect(String(res.body)).to.equal('Lorem ipsum odor amet, consectetuer adipiscing elit.');
        });

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Fetches the presigned S3 URL returned by the previous request. The URL is already encoded and signed, so URL re-encoding is switched off. Against AWS Emulator this needs `--insecure` (self-signed certificate).
