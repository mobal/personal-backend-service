info:
  name: Delete post — missing bearer token
  type: http
  seq: 16

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/posts/{{postId}}"
  headers:
    - name: Authorization
      value: "Bearer "

runtime:
  scripts:
    - type: tests
      code: |-
        test('responds with 403', () => {
          expect(res.status).to.equal(403);
        });
        test('reports the request as unauthenticated', () => {
          expect(res.body.message).to.equal('Not authenticated');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Deleting without credentials must be rejected with 403 "Not authenticated" before the post is touched. Sends an empty bearer token instead of `{{accessToken}}`.
