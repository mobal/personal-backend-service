info:
  name: Delete post — bearer token
  type: http
  seq: 18

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/posts/{{postId}}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test('responds with 204', () => {
          expect(res.status).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: This request deletes the post for real (204); the post id is then soft-deleted.
