info:
  name: List posts
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/v1/posts"

runtime:
  scripts:
    - type: tests
      code: |-
        test('responds with 200', () => {
          expect(res.status).to.equal(200);
        });
        test('returns a page of camelCase post summaries', () => {
          expect(res.body).to.have.property('posts');
          expect(res.body.posts).to.be.an('array');
          if (res.body.posts.length > 0) {
            expect(res.body.posts[0]).to.have.property('id');
            expect(res.body.posts[0]).to.have.property('title');
          }
        });
        test('includes the created published post', () => {
          const createdId = bru.getVar('postId');
          expect(res.body.posts.some((post) => post.id === createdId)).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Lists published posts (public) as a page of camelCase summaries. The post created above is published, so it must be listed.
